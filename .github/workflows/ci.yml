name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Fleet Core contract fake integration
        run: pnpm exec jest src/modules/agent-management/application/enrollment/__tests__/fleet-core.integration.spec.ts --runInBand

      - name: Fleet Node lifecycle gate and recovery
        run: pnpm exec jest src/modules/asset-topology/application/lifecycle/__tests__/node-lifecycle-orchestrator.spec.ts src/modules/asset-topology/infrastructure/mongodb/__tests__/mongo-node-lifecycle-operation.store.spec.ts src/modules/asset-topology/infrastructure/mongodb/migrations/__tests__/node-lifecycle-operations.migration.spec.ts src/modules/asset-topology/presentation/assets/__tests__/node-lifecycle-operation.controller.spec.ts --runInBand

      - name: M1 enrollment and retirement regressions
        run: pnpm exec jest src/modules/agent-management/application/registration/use-cases/__tests__/enroll-agent.use-case.spec.ts src/modules/agent-management/application/registration/use-cases/__tests__/issue-bootstrap-token.use-case.spec.ts src/modules/agent-management/presentation/registration/__tests__/bootstrap-token.controller.spec.ts src/modules/agent-management/presentation/registration/__tests__/enrollment.controller.spec.ts src/modules/asset-topology/application/assets/__tests__/retire-asset.use-case.spec.ts src/modules/asset-topology/application/placements/__tests__/asset-placement-management.use-case.spec.ts --runInBand

      - name: Unit tests
        run: pnpm test:cov --runInBand

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --ignore-unfixable --audit-level moderate

  secret-scan:
    name: Scan pull request changes for secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commits introduced by this pull request
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
