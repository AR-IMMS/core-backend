services:
  core-backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    env_file:
      - .env.local

    environment:
      NODE_ENV: production
      APP_PORT: "8080"
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-ar_imms_core}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""

    networks:
      - imms-shared

    ports:
      - "127.0.0.1:${CORE_API_HOST_PORT:-18080}:8080"

networks:
  imms-shared:
    external: true
