services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); }
          catch (error) {
            try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); }
            catch (initError) {}
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mongodb-data:
