  /api/v1/tickets/{ticket_id}/status:
    post:
      operationId: TicketWorkflowController_status
      parameters:
        - name: ticket_id
          required: true
          in: path
          x-nestjs_zod-parent-additional-properties: false
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,15}$
        - name: idempotency-key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: ^[A-Za-z0-9_-]{16,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum:
                    - OPEN
                    - PENDING
                pending_until:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              required:
                - state
              additionalProperties: false
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - ticket_id
                      - number
                      - title
                      - state_id
                      - priority_id
                      - created_at
                      - updated_at
                    properties:
                      ticket_id:
                        type: integer
                      number:
                        type: string
                      title:
                        type: string
                      state_id:
                        type: integer
                      priority_id:
                        type: integer
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                  meta:
                    type: object
                    required:
                      - request_id
                    properties:
                      request_id:
                        type: string
                      trace_id:
                        type: string
        "400":
          description: Invalid request or reference.
          content:
            application/problem+json:
              schema:
                $ref: ../baseline.yaml#/components/schemas/ErrorResponse
        "401":
          description: Human session required.
          content:
            application/problem+json:
              schema:
                $ref: ../baseline.yaml#/components/schemas/ErrorResponse
        "403":
          description: Actor or permission denied.
          content:
            application/problem+json:
              schema:
                $ref: ../baseline.yaml#/components/schemas/ErrorResponse
        "404":
          description: Ticket not found or inaccessible.
          content:
            application/problem+json:
              schema:
                $ref: ../baseline.yaml#/components/schemas/ErrorResponse
        "409":
          description: Conflict or unresolved outcome. Reuse the same operation key for recovery.
          content:
            application/problem+json:
              schema:
                $ref: ../baseline.yaml#/components/schemas/ErrorResponse
        "503":
          description: Ticket dependency unavailable.
          content:
            application/problem+json:
              schema:
                $ref: ../baseline.yaml#/components/schemas/ErrorResponse
      security:
        - HumanAccessToken: []
      summary: Perform a non-terminal progress transition
      tags:
        - Tickets
      x-required-permissions:
        - ticket:work
  /api/v1/tickets/{ticket_id}/articles:
    get:
      operationId: TicketWorkflowController_articles
      parameters:
        - name: ticket_id
          required: true
          in: path
          x-nestjs_zod-parent-additional-properties: false
          schema:
            type: string
            pattern: ^[1-9][0-9]{0,15}$
        - name: cursor
