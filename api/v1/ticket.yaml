        - HumanAccessToken: []
      x-required-permissions:
        - ticket:work
      parameters:
        - *a2
        - name: X-Evidence-Grant
          in: header
          required: true
          schema: *a7
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - upload_id
                    properties:
                      upload_id: *a6
                  meta:
                    $ref: ../baseline.yaml#/components/schemas/Meta
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "413": *a1
        "415": *a1
        "503": *a1
  /api/v1/tickets/{ticket_id}/evidence/finalize:
    post:
      operationId: TicketExtrasController_finalize
      summary: Verify Evidence and finalize with Audit
      tags:
        - Tickets
      security:
        - HumanAccessToken: []
      x-required-permissions:
        - ticket:work
      parameters:
        - *a2
        - *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - grant
              properties:
                grant: *a7
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/TicketEvidence"
                  meta:
                    $ref: ../baseline.yaml#/components/schemas/Meta
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "409": *a1
        "413": *a1
        "415": *a1
        "503": *a1
  /api/v1/tickets/{ticket_id}/evidence/{evidence_id}/access:
    post:
      operationId: TicketExtrasController_authorizeRead
      summary: Issue a sixty-second Evidence read grant
      tags:
        - Tickets
      security:
        - HumanAccessToken: []
      x-required-permissions:
        - ticket:read
      parameters:
        - *a2
        - &a8
          name: evidence_id
          in: path
          required: true
          schema: *a6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - disposition
              properties:
                disposition:
                  type: string
                  enum:
                    - inline
                    - attachment
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/TicketEvidenceGrant"
                  meta:
                    $ref: ../baseline.yaml#/components/schemas/Meta
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "503": *a1
  /api/v1/tickets/{ticket_id}/evidence/{evidence_id}/content:
    post:
      operationId: TicketExtrasController_content
      summary: Read protected image or attachment bytes
      tags:
        - Tickets
      security:
        - HumanAccessToken: []
      x-required-permissions:
        - ticket:read
      parameters:
        - *a2
        - *a8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - grant
              properties:
                grant: *a7
      responses:
        "200":
          description: Private bytes, no-store and nosniff. PDF is attachment-only.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "400": *a1
        "401": *a1
        "403": *a1
        "404": *a1
        "503": *a1
  /api/v1/ticket-notifications:
    get:
      operationId: TicketNotificationsController_list
      tags: [Tickets]
      summary: List recent visible Ticket notifications for the current recipient
      description: The latest 20 completed operations addressed to the caller before current Ticket visibility filtering. The unread count covers the returned items.
      security:
        - HumanAccessToken: []
      x-required-permissions: [ticket:read]
      responses:
        "200":
          description: Recent Ticket notifications.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [items, unread_count]
                    properties:
                      items:
                        type: array
                        maxItems: 20
                        items:
                          $ref: '#/components/schemas/TicketNotificationItem'
                      unread_count: { type: integer, minimum: 0, maximum: 20 }
                  meta:
                    type: object
                    properties:
                      request_id: { type: string }
                      trace_id: { type: string }
        "400": { description: Unsupported query. }
        "401": { description: Human session required. }
        "403": { description: Ticket notification access denied. }
        "503": { description: Ticket dependency unavailable. }
  /api/v1/ticket-notifications/read:
    post:
      operationId: TicketNotificationsController_markRead
      tags: [Tickets]
      summary: Mark the supplied visible Ticket notifications as read
      security:
        - HumanAccessToken: []
      x-required-permissions: [ticket:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Number of items newly marked as read, including zero for a replay.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [updated_count]
                    properties:
                      updated_count: { type: integer, minimum: 0, maximum: 20 }
                  meta:
                    type: object
                    properties:
                      request_id: { type: string }
                      trace_id: { type: string }
        "400": { description: Invalid notification identifiers or unsupported query. }
        "401": { description: Human session required. }
        "403": { description: Ticket notification access denied. }
        "404": { description: A notification is missing or inaccessible. }
        "503": { description: Ticket dependency unavailable. }
components:
  schemas:
    TicketNotificationItem:
      type: object
      required: [id, kind, ticket_id, ticket_number, ticket_title, occurred_at, read]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [created, responsibilities_changed, information_changed, progressed, closed, reopened, article_added, evidence_added]
        ticket_id: { type: integer, minimum: 1 }
        ticket_number: { type: string }
        ticket_title: { type: string }
        occurred_at: { type: string, format: date-time }
        read: { type: boolean }
    TicketArchiveRecord:
      type: object
      additionalProperties: false
      required:
        - ticket_id
        - archived
        - version
        - archived_at
        - archive_reason
      properties:
        ticket_id: &a1
          type: integer
          minimum: 1
        archived:
          type: boolean
        version: *a1
        archived_at: &a2
          type: string
          format: date-time
        archive_reason: &a3
          type: string
        restored_at: *a2
        restore_reason: *a3
    TicketArchivedListItem:
      type: object
      additionalProperties: false
      required:
        - ticket_id
        - number
        - title
        - state_id
        - priority_id
        - created_at
        - updated_at
        - archive
      properties:
        ticket_id: *a1
        number: *a3
        title: *a3
        state_id: *a1
        priority_id: *a1
        created_at: *a2
        updated_at: *a2
        archive:
          $ref: "#/components/schemas/TicketArchiveRecord"
    TicketEvidence:
      type: object
      additionalProperties: false
      required:
        - id
        - file_name
        - mime_type
        - file_size
        - created_at
      properties:
        id:
          type: string
          format: uuid
        file_name: *a3
        mime_type:
          type: string
          enum:
            - image/png
            - image/jpeg
            - image/webp
            - application/pdf
        file_size:
          type: integer
          minimum: 1
          maximum: 8388608
        created_at: *a2
    TicketEvidenceGrant:
      type: object
      additionalProperties: false
      required:
        - grant
        - expires_at
      properties:
        grant:
          type: string
          maxLength: 2048
        expires_at: *a2
    TicketPriorityMetadata:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - color
      properties:
        id: *a1
        label: *a3
        color:
          type: string
          enum:
            - green
            - cyan
            - amber
            - critical
            - neutral

  securitySchemes:
    HumanAccessToken:
      scheme: bearer
      bearerFormat: JWT
      type: http
