openapi: 3.1.2
info:
  title: AR-IMMS Core Asset & Topology API
  version: 1.0.0
  description: |
    Dashboard HTTP contract for the seeded Data Center and its Sites and Rooms.
    This REST/OpenAPI surface is separate from the Asset & Topology application
    contracts used by backend modules. Flow 1 provides no Data Center create or
    update operation. Parent references are chosen at creation and are immutable.

paths:
  /api/v1/asset-topology/assets:
    get:
      operationId: listAssets
      summary: List Assets by canonical ID
      description: Lists Assets in stable Asset ID order. AT-03 has no filters.
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:read]
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by the previous page.
          schema: { type: string, minLength: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Cursor-paginated Asset list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetPageResponse' }
        '400': { $ref: ../baseline.yaml#/components/responses/Problem }
        '401': { $ref: ../baseline.yaml#/components/responses/Problem }
        '403': { $ref: ../baseline.yaml#/components/responses/Problem }
    post:
      operationId: registerAsset
      summary: Register a physical Asset
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:manage]
      x-required-role: IT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAssetRequest' }
      responses:
        '201':
          description: Asset registered ACTIVE and unassigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResponse' }
        '400': { $ref: ../baseline.yaml#/components/responses/Problem }
        '401': { $ref: ../baseline.yaml#/components/responses/Problem }
        '403': { $ref: ../baseline.yaml#/components/responses/Problem }
        '404': { $ref: ../baseline.yaml#/components/responses/Problem }

  /api/v1/asset-topology/assets/{asset_id}:
    parameters:
      - name: asset_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      operationId: getAsset
      summary: Retrieve an Asset by canonical ID
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:read]
      responses:
        '200':
          description: Canonical Asset reference with current placement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetReferenceResponse' }
        '400': { $ref: ../baseline.yaml#/components/responses/Problem }
        '401': { $ref: ../baseline.yaml#/components/responses/Problem }
        '403': { $ref: ../baseline.yaml#/components/responses/Problem }
        '404': { $ref: ../baseline.yaml#/components/responses/Problem }
    patch:
      operationId: updateAsset
      summary: Update Asset descriptive information
      description: Asset Type is immutable. Omitted fields remain unchanged; explicit null clears Model or serial number.
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:manage]
      x-required-role: IT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAssetRequest' }
      responses:
        '200':
          description: Asset updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResponse' }
        '400': { $ref: ../baseline.yaml#/components/responses/Problem }
        '401': { $ref: ../baseline.yaml#/components/responses/Problem }
        '403': { $ref: ../baseline.yaml#/components/responses/Problem }
        '404': { $ref: ../baseline.yaml#/components/responses/Problem }

  /api/v1/asset-topology/data-centers/default:
    get:
      operationId: getDefaultDataCenter
      summary: Retrieve the default Data Center
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:read]
      responses:
        '200':
          description: The seeded, read-only Data Center.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCenterResponse'
        '401':
          $ref: ../baseline.yaml#/components/responses/Problem
        '403':
          $ref: ../baseline.yaml#/components/responses/Problem
        '404':
          $ref: ../baseline.yaml#/components/responses/Problem

  /api/v1/asset-topology/data-centers/{data_center_id}/sites:
    parameters:
      - $ref: '#/components/parameters/DataCenterId'
    get:
      operationId: listSites
      summary: List Sites beneath a Data Center
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:read]
      responses:
        '200':
          description: Sites under the requested Data Center.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteListResponse'
        '401':
          $ref: ../baseline.yaml#/components/responses/Problem
        '403':
          $ref: ../baseline.yaml#/components/responses/Problem
        '404':
          $ref: ../baseline.yaml#/components/responses/Problem
    post:
      operationId: createSite
      summary: Create a Site beneath a Data Center
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:manage]
      x-required-role: IT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Site created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '400':
          $ref: ../baseline.yaml#/components/responses/Problem
        '401':
          $ref: ../baseline.yaml#/components/responses/Problem
        '403':
          $ref: ../baseline.yaml#/components/responses/Problem
        '404':
          $ref: ../baseline.yaml#/components/responses/Problem

  /api/v1/asset-topology/sites/{site_id}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSite
      summary: Retrieve a Site
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:read]
      responses:
        '200':
          description: Site details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '401':
          $ref: ../baseline.yaml#/components/responses/Problem
        '403':
          $ref: ../baseline.yaml#/components/responses/Problem
        '404':
          $ref: ../baseline.yaml#/components/responses/Problem
    patch:
      operationId: updateSite
      summary: Update a Site name
      description: The Data Center parent reference is immutable after creation.
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:manage]
      x-required-role: IT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: Site updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteResponse'
        '400':
          $ref: ../baseline.yaml#/components/responses/Problem
        '401':
          $ref: ../baseline.yaml#/components/responses/Problem
        '403':
          $ref: ../baseline.yaml#/components/responses/Problem
        '404':
          $ref: ../baseline.yaml#/components/responses/Problem

  /api/v1/asset-topology/sites/{site_id}/rooms:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listRooms
      summary: List Rooms beneath a Site
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:read]
      responses:
        '200':
          description: Rooms under the requested Site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
        '401':
          $ref: ../baseline.yaml#/components/responses/Problem
        '403':
          $ref: ../baseline.yaml#/components/responses/Problem
        '404':
          $ref: ../baseline.yaml#/components/responses/Problem
    post:
      operationId: createRoom
      summary: Create a Room beneath a Site
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:manage]
      x-required-role: IT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '201':
          description: Room created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: ../baseline.yaml#/components/responses/Problem
        '401':
          $ref: ../baseline.yaml#/components/responses/Problem
        '403':
          $ref: ../baseline.yaml#/components/responses/Problem
        '404':
          $ref: ../baseline.yaml#/components/responses/Problem

  /api/v1/asset-topology/rooms/{room_id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: getRoom
      summary: Retrieve a Room and map configuration
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:read]
      responses:
        '200':
          description: Room details and map configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '401':
          $ref: ../baseline.yaml#/components/responses/Problem
        '403':
          $ref: ../baseline.yaml#/components/responses/Problem
        '404':
          $ref: ../baseline.yaml#/components/responses/Problem
    patch:
      operationId: updateRoom
      summary: Update a Room name and map configuration
      description: The Site parent reference is immutable after creation. Dimensions and grid snap are millimeters.
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:manage]
      x-required-role: IT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoomRequest'
      responses:
        '200':
          description: Room updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '400':
          $ref: ../baseline.yaml#/components/responses/Problem
        '401':
          $ref: ../baseline.yaml#/components/responses/Problem
        '403':
          $ref: ../baseline.yaml#/components/responses/Problem
        '404':
          $ref: ../baseline.yaml#/components/responses/Problem

  /api/v1/asset-topology/rooms/{room_id}/map:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      operationId: getRoomMap
      summary: Retrieve a Room grid and its confirmed Rack cells
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:read]
      responses:
        '200':
          description: Generated full-cell grid and active Rack placements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomMapResponse' }
        '401': { $ref: ../baseline.yaml#/components/responses/Problem }
        '403': { $ref: ../baseline.yaml#/components/responses/Problem }
        '404': { $ref: ../baseline.yaml#/components/responses/Problem }

  /api/v1/asset-topology/rooms/{room_id}/racks:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      operationId: createRack
      summary: Create a Rack with its initial one-cell location
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:manage]
      x-required-role: IT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRackRequest' }
      responses:
        '201':
          description: Rack and initial location created atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RackResponse' }
        '400': { $ref: ../baseline.yaml#/components/responses/Problem }
        '401': { $ref: ../baseline.yaml#/components/responses/Problem }
        '403': { $ref: ../baseline.yaml#/components/responses/Problem }
        '404': { $ref: ../baseline.yaml#/components/responses/Problem }

  /api/v1/asset-topology/racks/{rack_id}:
    parameters:
      - name: rack_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      operationId: getRack
      summary: Retrieve a Rack and its confirmed location
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:read]
      responses:
        '200':
          description: Canonical Rack reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RackResponse' }
        '401': { $ref: ../baseline.yaml#/components/responses/Problem }
        '403': { $ref: ../baseline.yaml#/components/responses/Problem }
        '404': { $ref: ../baseline.yaml#/components/responses/Problem }
    patch:
      operationId: updateRack
      summary: Update Rack capacity and row/position labels
      description: Rack ID is immutable. Location changes use the location operation; QR is managed by AT-07.
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:manage]
      x-required-role: IT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRackRequest' }
      responses:
        '200':
          description: Rack updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RackResponse' }
        '400': { $ref: ../baseline.yaml#/components/responses/Problem }
        '401': { $ref: ../baseline.yaml#/components/responses/Problem }
        '403': { $ref: ../baseline.yaml#/components/responses/Problem }
        '404': { $ref: ../baseline.yaml#/components/responses/Problem }

  /api/v1/asset-topology/racks/{rack_id}/location:
    parameters:
      - name: rack_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    patch:
      operationId: moveRack
      summary: Move or rotate a Rack
      description: An unchanged Room, cell, and rotation is a no-op with no history or Audit Fact.
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:manage]
      x-required-role: IT_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveRackRequest' }
      responses:
        '200':
          description: Rack and location history updated atomically, or current location returned for a no-op.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RackResponse' }
        '400': { $ref: ../baseline.yaml#/components/responses/Problem }
        '401': { $ref: ../baseline.yaml#/components/responses/Problem }
        '403': { $ref: ../baseline.yaml#/components/responses/Problem }
        '404': { $ref: ../baseline.yaml#/components/responses/Problem }

  /api/v1/asset-topology/racks/{rack_id}/locations:
    parameters:
      - name: rack_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    get:
      operationId: getRackLocationHistory
      summary: Retrieve time-bounded Rack location history
      security:
        - HumanAccessToken: []
      x-required-permissions: [asset:read]
      responses:
        '200':
          description: Historical and active Rack Room-map locations.
          content:
            application/json:
              schema:
                { $ref: '#/components/schemas/RackLocationHistoryResponse' }
        '401': { $ref: ../baseline.yaml#/components/responses/Problem }
        '403': { $ref: ../baseline.yaml#/components/responses/Problem }
        '404': { $ref: ../baseline.yaml#/components/responses/Problem }

components:
  securitySchemes:
    HumanAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DataCenterId:
      name: data_center_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SiteId:
      name: site_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Asset:
      type: object
      required:
        [
          id,
          name,
          asset_type_id,
          model_id,
          manufacturer_serial_number,
          lifecycle_state,
          current_placement,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        asset_type_id: { type: string }
        model_id: { type: [string, 'null'] }
        manufacturer_serial_number: { type: [string, 'null'] }
        lifecycle_state: { type: string, enum: [ACTIVE, MAINTENANCE, RETIRED] }
        current_placement: { type: [object, 'null'] }
    AssetReference:
      type: object
      required: [id, name, asset_type_id, lifecycle_state, current_placement]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        asset_type_id: { type: string }
        lifecycle_state: { type: string, enum: [ACTIVE, MAINTENANCE, RETIRED] }
        current_placement: { type: [object, 'null'] }
    RegisterAssetRequest:
      type: object
      additionalProperties: false
      required: [name, asset_type_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        asset_type_id: { type: string }
        model_id: { type: string }
        manufacturer_serial_number:
          {
            type: string,
            maxLength: 128,
            description: Blank values are normalized to absent.,
          }
    UpdateAssetRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        model_id: { type: string, nullable: true }
        manufacturer_serial_number:
          {
            type: string,
            maxLength: 128,
            nullable: true,
            description: Blank values clear the serial number.,
          }
  schemas:
    CreateRackRequest:
      type: object
      additionalProperties: false
      required: [column, row, rotation, u_capacity]
      properties:
        column: { type: integer, minimum: 0 }
        row: { type: integer, minimum: 0 }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
        u_capacity: { type: integer, minimum: 1 }
        row_label: { type: string, minLength: 1, maxLength: 128 }
        position_in_row: { type: string, minLength: 1, maxLength: 128 }
    UpdateRackRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        u_capacity: { type: integer, minimum: 1 }
        row_label: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        position_in_row:
          { type: [string, 'null'], minLength: 1, maxLength: 128 }
    MoveRackRequest:
      type: object
      additionalProperties: false
      required: [room_id, column, row, rotation]
      properties:
        room_id: { type: string, minLength: 1, maxLength: 128 }
        column: { type: integer, minimum: 0 }
        row: { type: integer, minimum: 0 }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
    RackLocation:
      type: object
      required: [room_id, column, row, rotation]
      properties:
        room_id: { type: string }
        column: { type: integer, minimum: 0 }
        row: { type: integer, minimum: 0 }
        rotation: { type: integer, enum: [0, 90, 180, 270] }
    RackResponse:
      type: object
      required: [id, u_capacity, current_location]
      properties:
        id: { type: string }
        u_capacity: { type: integer, minimum: 1 }
        row_label: { type: [string, 'null'] }
        position_in_row: { type: [string, 'null'] }
        current_location:
          {
            oneOf:
              [{ $ref: '#/components/schemas/RackLocation' }, { type: 'null' }],
          }
    RackLocationHistoryEntry:
      allOf:
        - $ref: '#/components/schemas/RackLocation'
        - type: object
          required: [valid_from, valid_to]
          properties:
            valid_from: { type: string, format: date-time }
            valid_to: { type: [string, 'null'], format: date-time }
    RackLocationHistoryResponse:
      type: object
      required: [rack_id, locations]
      properties:
        rack_id: { type: string }
        locations:
          type: array
          items: { $ref: '#/components/schemas/RackLocationHistoryEntry' }
    RoomMapResponse:
      type: object
      required: [id, width_mm, depth_mm, grid_snap_mm, columns, rows, racks]
      properties:
        id: { type: string }
        width_mm: { type: integer, minimum: 1 }
        depth_mm: { type: integer, minimum: 1 }
        grid_snap_mm: { type: integer, minimum: 1 }
        columns: { type: integer, minimum: 0 }
        rows: { type: integer, minimum: 0 }
        racks:
          type: array
          items: { $ref: '#/components/schemas/RackResponse' }
    Meta:
      type: object
      properties:
        request_id: { type: string }
        trace_id: { type: string }
    SingleResponse:
      type: object
      required: [data]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    ListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {}
        meta: { $ref: '#/components/schemas/Meta' }
    DataCenter:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: dc-default }
        name: { type: string, example: Default Data Center }
    Site:
      type: object
      required: [id, name, data_center_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        data_center_id: { type: string }
    Room:
      type: object
      required: [id, name, site_id, width_mm, depth_mm, grid_snap_mm]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        site_id: { type: string, format: uuid }
        width_mm: { type: integer, minimum: 1 }
        depth_mm: { type: integer, minimum: 1 }
        grid_snap_mm: { type: integer, minimum: 1 }
    CreateSiteRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
    UpdateSiteRequest:
      $ref: '#/components/schemas/CreateSiteRequest'
    CreateRoomRequest:
      type: object
      additionalProperties: false
      required: [name, width_mm, depth_mm, grid_snap_mm]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        width_mm: { type: integer, minimum: 1 }
        depth_mm: { type: integer, minimum: 1 }
        grid_snap_mm: { type: integer, minimum: 1 }
    UpdateRoomRequest:
      $ref: '#/components/schemas/CreateRoomRequest'
    DataCenterResponse:
      allOf:
        - $ref: '#/components/schemas/SingleResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/DataCenter' }
    SiteResponse:
      allOf:
        - $ref: '#/components/schemas/SingleResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Site' }
    SiteListResponse:
      allOf:
        - $ref: '#/components/schemas/ListResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Site' }
    RoomResponse:
      allOf:
        - $ref: '#/components/schemas/SingleResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Room' }
    RoomListResponse:
      allOf:
        - $ref: '#/components/schemas/ListResponse'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Room' }
    AssetResponse:
      allOf:
        - $ref: '#/components/schemas/SingleResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/Asset' }
    AssetReferenceResponse:
      allOf:
        - $ref: '#/components/schemas/SingleResponse'
        - type: object
          properties:
            data: { $ref: '#/components/schemas/AssetReference' }
    AssetPageResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Asset' }
        pagination:
          type: object
          required: [type, next_cursor]
          properties:
            type: { type: string, const: cursor }
            next_cursor: { type: [string, 'null'] }
        meta: { $ref: '#/components/schemas/Meta' }
