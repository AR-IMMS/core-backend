openapi: 3.1.0
info:
  title: AR-IMMS Core-to-Fleet Enrollment API
  version: 0.1.0
  description: |
    Human-facing Core operations that request Fleet enrollment invitations
    and synchronize Fleet registration into Core-owned Asset-Agent association
    state. Fleet Manager remains authoritative for technical Agent identity,
    credentials, registry, and lifecycle.
servers:
  - url: https://core.example.com
    description: Example Core deployment; use the configured trusted origin
tags:
  - name: Fleet Enrollment
    description: Core-authorized operations over Fleet-owned invitations
paths:
  /api/v1/nodes/{nodeId}/agent-fleet-invitations:
    post:
      tags: [Fleet Enrollment]
      operationId: requestFleetEnrollmentInvitation
      summary: Request a Fleet enrollment invitation for a Node
      description: |
        Requires an authenticated human with `agent:manage`. Core checks that
        the Node is active, placed, and not locally or remotely bound before
        calling Fleet. The `Idempotency-Key` is scoped to the authenticated
        actor and normalized Node request; reuse with another actor or request
        conflicts. Core persists only an operation reference and status. A
        pending, unexpired invitation token is returned with `Cache-Control:
        no-store`; replay after redemption, cancellation, or expiry is status
        only. Fleet invitation details are read and updated through the
        configured Fleet Manager REST integration.
      security:
        - HumanAccessToken: []
      parameters:
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
      responses:
        '201':
          description: Invitation created or the operation replayed.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Core sends no-store because a pending response may contain an invitation secret.
          content:
            application/json:
              schema:
                type: object
                required: [operation_id, status]
                properties:
                  operation_id: { type: string, format: uuid }
                  invitation_id: { type: string }
                  node_id: { type: string, format: uuid }
                  status:
                    type: string
                    enum:
                      [
                        REQUEST_PENDING,
                        PENDING,
                        REDEEMED,
                        CANCELLED,
                        EXPIRED,
                        REVOKED,
                        UNKNOWN,
                      ]
                  expires_at: { type: string, format: date-time }
                  invitation_token:
                    type: string
                    description: Present only while the invitation is pending and unexpired.
                  installation_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimitedProblem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/agent-fleet-invitations/{invitationId}/synchronize:
    post:
      tags: [Fleet Enrollment]
      operationId: synchronizeFleetEnrollment
      summary: Synchronize Fleet registration into the Core Node binding
      description: |
        Requires an authenticated human with `agent:manage`. This explicit
        query asks Fleet for the invitation's current state; Core creates a
        local business binding only after Fleet confirms redemption and an
        active installation matching the invitation's authorized Node. Pending
        and terminal states do not create a binding. If Fleet succeeds but the
        Core transaction fails, Core returns 503 with the stable operation ID;
        retry this action. The response never contains an invitation secret.
        Core's local binding projection is not Fleet registry or credential data.
      security:
        - HumanAccessToken: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current remote state and Core synchronization result.
          content:
            application/json:
              schema:
                type: object
                required: [operation_id, invitation_id, node_id, status]
                properties:
                  operation_id: { type: string, format: uuid }
                  invitation_id: { type: string, format: uuid }
                  node_id: { type: string, format: uuid }
                  status:
                    type: string
                    enum:
                      [PENDING, REDEEMED, CANCELLED, EXPIRED, UNKNOWN, BOUND]
                  installation_id: { type: string, format: uuid }
                  binding_id: { type: string }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    HumanAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Human IAM authentication; actual browser-cookie transport may also be supported by Core.
  schemas:
    ProblemDetails:
      type: object
      description: Core Problem Details (RFC 9457) with a stable application error code.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - BAD_REQUEST
            - UNAUTHORIZED
            - CONFLICT
            - FORBIDDEN
            - NOT_FOUND
            - TOO_MANY_REQUESTS
            - INTERNAL_SERVER_ERROR
            - NODE_NOT_ELIGIBLE
            - IDEMPOTENCY_KEY_REQUIRED
            - IDEMPOTENCY_KEY_REUSED
            - FLEET_OPERATION_PENDING
            - FLEET_SYNC_PENDING
            - FLEET_UNAVAILABLE
            - FLEET_INVALID_RESPONSE
            - FLEET_OPERATION_TERMINAL
            - FLEET_INSTALLATION_NOT_ACTIVE
            - FLEET_BINDING_ALREADY_REVOKED
            - NODE_OR_INSTALLATION_ALREADY_BOUND
            - NODE_STATE_CHANGED_DURING_ENROLLMENT
        request_id: { type: string }
  responses:
    Problem:
      description: Failure described by the response status and application code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://docs.ar-imms.dev/problems/fleet-unavailable
            title: Fleet unavailable
            status: 503
            code: FLEET_UNAVAILABLE
            detail: Fleet could not complete the requested operation.
            request_id: req_01JEXAMPLE
    RateLimitedProblem:
      description: |
        Optional response from a deployment edge when it applies rate limits.
        Core does not implement rate limiting for these operations. Callers
        should respect Retry-After when present.
      headers:
        Retry-After:
          schema: { type: string }
          description: Number of seconds or HTTP-date
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
